# Les versions de l'appli, à un seul endroit. Le greffon d'Android (agp) est la dernière version stable que connaît
# l'Android Studio du poste (Rabbit 2, 2026.2.2 : `lastStableBuildVersion`). Depuis AGP 9, il compile le Kotlin
# lui-même, avec le greffon de Kotlin à la version `kotlin` (déclaré à la racine sans s'appliquer), que celui de Compose
# doit suivre.
[versions]
agp = "9.4.1"
kotlin = "2.3.21"
compose-bom = "2026.09.00"
activity = "1.13.0"
core = "1.19.1"
lifecycle = "2.11.0"
# La liaison avec l'ordinateur (HTTPS épinglé, le flux) ; la lecture du code carré (ZXing, Apache 2.0, sans les
# services de Google).
okhttp = "5.5.0"
zxing = "4.3.0"
junit = "4.13.2"
# org.json, celui d'Android, pour les essais qui tournent hors d'un téléphone (Android n'en donne qu'une coquille).
json = "20240303"

[libraries]
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-sse = { module = "com.squareup.okhttp3:okhttp-sse", version.ref = "okhttp" }
zxing = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxing" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
